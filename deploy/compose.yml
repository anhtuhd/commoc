services:
  web:
    image: commo:vps-initial
    restart: unless-stopped
    ports:
      - "127.0.0.1:3301:3000"
    env_file:
      - /opt/commo/secrets/commo.env
    volumes:
      - /opt/commo/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/store/public').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
